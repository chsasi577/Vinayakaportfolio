  </g>
  <!-- Upload Camera Icon badge -->
  <g transform="translate(130, 130)">
    <circle cx="20" cy="20" r="18" fill="#FF9800" stroke="#FFF" stroke-width="2"/>
    <path d="M 12 18 L 14 14 L 26 14 L 28 18 L 30 18 C 31.1 18 32 18.9 32 20 L 32 28 C 32 29.1 31.1 30 30 30 L 10 30 C 8.9 30 8 29.1 8 28 L 8 20 C 8 18.9 8.9 18 10 18 Z" fill="#FFFFFF"/>
