<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FFB300" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FF5722" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D50000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clayBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="50%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#5D1000"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5C042"/>
      <stop offset="50%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#D49A1F"/>
    </linearGradient>
  </defs>

  <!-- Radiant Aura -->
  <circle cx="50" cy="36" r="32" fill="url(#flameGlow)"/>

  <!-- Outer Flame -->
  <path d="M 50 10 C 38 28 35 42 50 48 C 65 42 62 28 50 10 Z" fill="#FF9800"/>
  <!-- Inner Flame -->
  <path d="M 50 20 C 42 32 42 42 50 46 C 58 42 58 32 50 20 Z" fill="#FFF176"/>
  <!-- Wick Core -->
  <ellipse cx="50" cy="46" rx="3" ry="5" fill="#424242"/>

  <!-- Diya Clay Body -->
  <!-- Base Stand -->
  <path d="M 36 78 L 64 78 L 60 84 L 40 84 Z" fill="#BF360C" stroke="#8C2500" stroke-width="1.5"/>
  <!-- Main Bowl -->
  <path d="M 12 56 C 14 76 34 80 50 80 C 66 80 86 76 88 56 C 88 53 12 53 12 56 Z" fill="url(#clayBase)" stroke="#8C2500" stroke-width="2"/>
  <!-- Diya Golden Rim / Lip -->
  <ellipse cx="50" cy="55" rx="38" ry="8" fill="url(#goldRim)" stroke="#8C2500" stroke-width="1.5"/>
  <ellipse cx="50" cy="55" rx="32" ry="5" fill="#E65100"/>

  <!-- Ornate Carvings on Diya Body -->
  <path d="M 22 62 Q 50 72 78 62" stroke="#FFD54F" stroke-width="1.5" fill="none"/>
  <circle cx="35" cy="69" r="2.5" fill="#FFD54F"/>
  <circle cx="50" cy="72" r="3" fill="#FFF9C4"/>
  <circle cx="65" cy="69" r="2.5" fill="#FFD54F"/>
</svg>
