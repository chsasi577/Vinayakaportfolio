<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5C042"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldM)" stroke-width="1.5" transform="translate(150,150)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="140" stroke-width="2"/>
    <circle cx="0" cy="0" r="134" stroke-dasharray="3,4" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="120" stroke-width="1.5"/>

    <!-- 16 Outer Lotus Petals -->
    <g>
      <!-- Petal 1 to 16 -->
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" fill="rgba(212,175,55,0.08)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(22.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(45)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(67.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(90)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(112.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(135)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(157.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(180)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(202.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(225)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(247.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(270)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(292.5)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(315)"/>
      <path d="M 0 -120 Q 15 -136 0 -144 Q -15 -136 0 -120" transform="rotate(337.5)"/>
    </g>

    <!-- Mid Petal Layer (8 Petals) -->
    <g>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" fill="rgba(230,81,0,0.08)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(45)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(90)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(135)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(180)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(225)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(270)"/>
      <path d="M 0 -70 C 35 -100 50 -100 0 -120 C -50 -100 -35 -100 0 -70" transform="rotate(315)"/>
    </g>

    <!-- Inner Core & Star -->
    <circle cx="0" cy="0" r="45" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" stroke-width="1.5" stroke-dasharray="2,3"/>
    <polygon points="0,-45 13,-13 45,0 13,13 0,45 -13,13 -45,0 -13,-13" fill="rgba(212,175,55,0.2)"/>
    <circle cx="0" cy="0" r="8" fill="#FF9800"/>
  </g>
</svg>
