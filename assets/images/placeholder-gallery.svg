<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0D15"/>
      <stop offset="100%" stop-color="#1A0408"/>
    </linearGradient>
    <linearGradient id="gBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#8C5C05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gBg)" rx="12"/>
  <!-- Festive Border -->
  <rect x="15" y="15" width="570" height="420" rx="8" fill="none" stroke="url(#gBorder)" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Corner Floral Accents -->
  <circle cx="30" cy="30" r="8" fill="#FFB300"/>
  <circle cx="570" cy="30" r="8" fill="#FFB300"/>
  <circle cx="30" cy="420" r="8" fill="#FFB300"/>
  <circle cx="570" cy="420" r="8" fill="#FFB300"/>

  <!-- Center Camera / Festive Icon -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="55" fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="2"/>
    <!-- Diya/Photo Icon -->
    <path d="M -30 15 C -25 35 25 35 30 15 Z" fill="#FF7722"/>
    <ellipse cx="0" cy="15" rx="30" ry="7" fill="#FFD54F"/>
    <path d="M 0 -25 C -10 -8 -8 5 0 10 C 8 5 10 -8 0 -25 Z" fill="#FFB300"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Text -->
  <text x="300" y="280" font-family="'Cinzel', 'Poppins', sans-serif" font-size="20" font-weight="bold" fill="#FFE885" text-anchor="middle" letter-spacing="1">
    FESTIVAL MOMENTS
  </text>
  <text x="300" y="315" font-family="'Noto Sans Telugu', 'Poppins', sans-serif" font-size="15" fill="#FFB74D" text-anchor="middle">
    [ Click to View / Add Real Photo ]
  </text>
  <text x="300" y="340" font-family="'Poppins', sans-serif" font-size="12" fill="#BCAAA4" text-anchor="middle">
    Replace placeholder with your festival photos in assets/
  </text>
</svg>
